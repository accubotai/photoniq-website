name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Secretlint
        run: npx secretlint "**/*"
      - name: Run ESLint
        run: npx eslint "**/*.js" || true
      - name: Run Stylelint
        run: npx stylelint "**/*.css" || true
      - name: Run Markuplint
        run: npx markuplint "**/*.html" || true
      - name: Check Prettier
        run: npx prettier --check "**/*" || true
